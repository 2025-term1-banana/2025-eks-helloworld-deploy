# Stable Service
apiVersion: v1
kind: Service
metadata:
  name: hello-backend-stable
  namespace: hello-backend
spec:
  selector:
    app: hello-backend
  ports:
    - port: 80
      targetPort: 5000
      protocol: TCP
---
# Canary Service
apiVersion: v1
kind: Service
metadata:
  name: hello-backend-canary
  namespace: hello-backend
spec:
  selector:
    app: hello-backend
  ports:
    - port: 80
      targetPort: 5000
      protocol: TCP
