# Stable Service
apiVersion: v1
kind: Service
metadata:
  name: banana-beta-stable
  namespace: banana-beta
spec:
  selector:
    app: banana-beta
  ports:
    - port: 80
      targetPort: 5000
      protocol: TCP
---
# Canary Service
apiVersion: v1
kind: Service
metadata:
  name: banana-beta-canary
  namespace: banana-beta
spec:
  selector:
    app: banana-beta
  ports:
    - port: 80
      targetPort: 5000
      protocol: TCP
