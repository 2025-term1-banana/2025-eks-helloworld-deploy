# Stable Service
apiVersion: v1
kind: Service
metadata:
  name: banana-stable
  namespace: banana
spec:
  selector:
    app: banana
  ports:
    - port: 80
      targetPort: 5000
      protocol: TCP
---
# Canary Service
apiVersion: v1
kind: Service
metadata:
  name: banana-canary
  namespace: banana
spec:
  selector:
    app: banana
  ports:
    - port: 80
      targetPort: 5000
      protocol: TCP
