apiVersion: v1
kind: Namespace
metadata:
  name: helloworld
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flask-hello
  namespace: helloworld
spec:
  replicas: 1
  selector:
    matchLabels:
      app: flask-hello
  template:
    metadata:
      labels:
        app: flask-hello
    spec:
      containers:
      - name: flask-hello
        image: 624577703989.dkr.ecr.ap-northeast-1.amazonaws.com/hackathon:latest
        ports:
        - containerPort: 5000
