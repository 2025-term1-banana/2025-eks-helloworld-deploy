apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: hello-backend-hpa
  namespace: hello-backend
spec:
  scaleTargetRef:
    apiVersion: argoproj.io/v1alpha1
    kind: Rollout
    name: hello-backend
  minReplicas: 2
  maxReplicas: 4
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70