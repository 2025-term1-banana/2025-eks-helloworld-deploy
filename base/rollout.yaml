apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: banana
  namespace: banana
spec:
  replicas: 2
  minReadySeconds: 10
  selector:
    matchLabels:
      app: banana
  template:
    metadata:
      labels:
        app: banana
    spec:
      revisionHistoryLimit: 3
      terminationGracePeriodSeconds: 60
      serviceAccountName: secret-db-iam
      containers:
        - name: banana
          image: 624577703989.dkr.ecr.ap-northeast-1.amazonaws.com/hackathon:20251109063737
          ports:
            - containerPort: 5000
          readinessProbe:
            httpGet:
              path: /
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3
  strategy:
    canary:
      stableService: banana-stable
      canaryService: banana-canary
      trafficRouting:
        alb:
          ingress: banana-ingress
          servicePort: 80
      steps:
        - setCanaryScale:
            replicas: 2
        - pause: {duration: "1m"}
        - setWeight: 25
        - pause: {duration: "1m"}
        - setWeight: 50
        - pause: {duration: "1m"}
        - setWeight: 75
        - pause: {duration: "1m"}
        - setWeight: 100
