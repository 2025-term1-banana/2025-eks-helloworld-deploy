apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: hello-backend
  namespace: hello-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hello-backend
  template:
    metadata:
      labels:
        app: hello-backend
    spec:
      containers:
        - name: hello-backend
          # CI가 푸시한 ECR 이미지를 바라봅니다.
          # AWS_ACCOUNT_ID와 REGION, REPOSITORY_NAME을 실제 값으로 변경해야 합니다.
          image: 624577703989.dkr.ecr.ap-northeast-1.amazonaws.com/hackathon:20251106164935
          ports:
            - containerPort: 5000 # Flask 앱 포트
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
  minReadySeconds: 30
  revisionHistoryLimit: 3
  strategy:
    canary: # Blue-Green을 원하시면 이 부분을 수정
      stableService: hello-backend-stable
      canaryService: hello-backend-canary
      trafficRouting:
        alb:
          ingress: hello-backend-ingress
          servicePort: 80 # Service 포트
      steps:
        - setWeight: 25
        - pause: {duration: "1m"}
        - setWeight: 50
        - pause: {duration: "1m"}
