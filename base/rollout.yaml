apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: hello-backend
  namespace: hello-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: hello-backend
  template:
    metadata:
      labels:
        app: hello-backend
    spec:
      containers:
        - name: hello-backend
          image: 624577703989.dkr.ecr.ap-northeast-1.amazonaws.com/hackathon:20251106164935
          ports:
            - containerPort: 5000
  strategy:
    canary:
      stableService: hello-backend-stable
      canaryService: hello-backend-canary
      trafficRouting:
        alb:
          ingress: hello-backend-ingress
          servicePort: 80
      steps:
        - setWeight: 25
        - pause: { duration: "2m" }
        - setWeight: 50
        - pause: { duration: "5m" }
        - setWeight: 100
        - pause: { duration: "1m" }
