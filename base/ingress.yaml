apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hello-backend-ingress
  namespace: hello-backend
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/target-type: ip # Fargate 필수
    alb.ingress.kubernetes.io/scheme: internet-facing
    
    # --- 도메인 및 HTTPS 적용을 위한 어노테이션 ---
    # 1. 요청하신 ACM 인증서 ARN
    alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:ap-northeast-1:624577703989:certificate/345c23d6-1c4a-47e7-b251-1b03e9ba46bb
    # 2. HTTPS (443) 및 HTTP (80) 리스너 설정
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS":443}]'
    # 3. HTTP(80) 트래픽을 HTTPS(443)로 자동 리다이렉션
    alb.ingress.kubernetes.io/ssl-redirect: '443'
spec:
  ingressClassName: alb
  # --- TLS 설정 추가 ---
  # Ingress가 해당 호스트에 대해 TLS를 사용하도록 지정
  tls:
  - hosts:
    - rc.mailshuttles.com
  rules:
  # --- Host 추가 ---
  # 요청하신 도메인으로 들어오는 트래픽을 처리
  - host: rc.mailshuttles.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            # 트래픽은 여전히 stable 서비스로 전달됩니다.
            name: hello-backend-stable 
            port:
              number: 80 # Service의 포트 (targetPort: 5000)