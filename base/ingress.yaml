apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  namespace: flask-hello
  name: flask-hello-ingress
  annotation:
    alb.ingress.kubernetes.io/group.name: flask-hello-test
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/healthcheck-path: "/"
    alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:ap-northeast-1:624577703989:certificate/345c23d6-1c4a-47e7-b251-1b03e9ba46bb
    alb.ingress.kubernetes.io/backend-protocol: HTTP
    alb.ingress.kubernetes.io/target-type: ip
spec:
  ingressClassName: alb
  rules:
    - host: "rc.mailshuttles.com"
      http:
        paths:
          - backend:
              service:
                name: ssl-redirect
                port:
                  name: use-annotation
            path: /
            pathType: Prefix
          - backend:
              service:
                name: rollout-bluegreen-active
                port:
                  number: 80
            path: /
            pathType: Prefix