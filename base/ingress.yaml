# ✅ 운영용 ALB Ingress (기존 ACM 사용)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hello-backend-ingress
  namespace: hello-backend
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80,"HTTPS":443}]'
    alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:ap-northeast-1:624577703989:certificate/345c23d6-1c4a-47e7-b251-1b03e9ba46bb
    alb.ingress.kubernetes.io/group.name: hello-backend
    alb.ingress.kubernetes.io/actions.ssl-redirect: >
      {"Type": "redirect", "RedirectConfig": { "Protocol": "HTTPS", "Port": "443", "StatusCode": "HTTP_301"}}
spec:
  ingressClassName: alb
  rules:
    - host: rc.mailshuttles.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ssl-redirect
                port:
                  name: use-annotation
          - path: /
            pathType: Prefix
            backend:
              service:
                name: hello-backend-stable
                port:
                  number: 80
---
# ✅ Canary 테스트용 Ingress (별도 도메인 + x-canary 헤더 기반)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hello-backend-ingress-preview
  namespace: hello-backend
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80,"HTTPS":443}]'
    alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:ap-northeast-1:624577703989:certificate/a1ab7988-d74c-4794-bdb1-1e0a242c29b7
    alb.ingress.kubernetes.io/group.name: hello-backend
    alb.ingress.kubernetes.io/actions.ssl-redirect: >
      {"Type": "redirect", "RedirectConfig": { "Protocol": "HTTPS", "Port": "443", "StatusCode": "HTTP_301"}}
    alb.ingress.kubernetes.io/canary: "true"
    alb.ingress.kubernetes.io/canary-by-header: "x-canary"
    alb.ingress.kubernetes.io/canary-by-header-value: "true"
    # "hello-backend-action"이라는 이름의 액션을 정의합니다.
    # 평상시: Stable 100%, Canary 0%
    # Argo Rollouts는 배포 시 이 JSON의 'Weight' 값만 수정합니다.
    alb.ingress.kubernetes.io/actions.hello-backend-action: >
      {"Type":"forward","ForwardConfig":{"TargetGroups":[{"ServiceName":"hello-backend-stable","ServicePort":"80","Weight":100},{"ServiceName":"hello-backend-canary","ServicePort":"80","Weight":0}]}}
spec:
  ingressClassName: alb
  rules:
    - host: rollouts-test-preview.rc.mailshuttles.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ssl-redirect
                port:
                  name: use-annotation
          - path: /
            pathType: Prefix
            backend:
              service:
                name: hello-backend-canary
                port:
                  number: 80
